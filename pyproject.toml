[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libre-stage-user-service"
version = "0.1.0"
description = "Auth and user-management service extracted from libre-stage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.5",
    "pydantic[email]>=2.11.7",
    "python-dotenv>=1.1.1",
    "pyjwt>=2.10.1",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.16.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
