version: "3"

tasks:
  install:
    cmds:
      - uv sync --all-groups
      - cd frontend && npm install
    desc: Install backend and frontend dependencies

  db:prepare:
    cmds:
      - mkdir -p backend/db
      - touch backend/db/app.db
    desc: Ensure the SQLite database file exists

  backend-dev:
    cmds:
      - task db:prepare
      - uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    desc: Start FastAPI backend

  backend-debug:
    cmds:
      - task db:prepare
      - uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug --access-log
    desc: Start FastAPI backend with verbose request logging

  frontend-dev:
    env:
      VITE_API_URL: "http://localhost:8000"
    cmds:
      - cd frontend && npm run dev
    desc: Start frontend dev server

  test:
    cmds:
      - uv run pytest
    desc: Run backend tests

  test:load:
    cmds:
      - uv run pytest -m load
    desc: Run bandwidth-throttled PDF sync load tests

  db:migrate:
    cmds:
      - uv run alembic upgrade head
    desc: Apply all migrations

  db:rollback:
    cmds:
      - uv run alembic downgrade -1
    desc: Revert last migration

  db:revision:
    cmds:
      - uv run alembic revision --autogenerate -m "{{.MSG}}"
    desc: Create a new autogenerated migration

  db:history:
    cmds:
      - uv run alembic history --verbose
    desc: Show migration history

  db:current:
    cmds:
      - uv run alembic current
    desc: Show current migration state

  db:seed-demo:
    cmds:
      - uv run python backend/migrations/init_demo_users.py
    desc: Migrate schema and reset the local demo dataset

  node:init:
    cmds:
      - uv run python -m backend.operations prepare-database
      - task db:migrate
      - uv run python -m backend.operations init-node
    desc: Initialize the database schema and persistent node identity

  sync-worker:
    env:
      SYNC_ENABLED: "true"
    cmds:
      - uv run python -m backend.sync.worker
    desc: Run the synchronization worker without starting the API

  snapshot:export:
    cmds:
      - uv run python -m backend.operations export-snapshot --output "{{.OUTPUT}}"
    desc: Export an online SQLite snapshot and a verified score-blob index

  snapshot:ack-bootstrap:
    cmds:
      - uv run python -m backend.operations ack-bootstrap --peer-id "{{.PEER_ID}}" --cursor "{{.CURSOR}}"
    desc: Advance a new hub peer to the verified snapshot cursor

  node:restore-snapshot:
    cmds:
      - uv run python -m backend.operations restore-snapshot --snapshot "{{.SNAPSHOT}}" --hub-url "{{.HUB_URL}}" --hub-credentials-reference "{{.HUB_CREDENTIALS_REFERENCE}}"
    desc: Bootstrap a new node from a hub snapshot and continue incremental sync
