version: "3"

tasks:
  desktop:linux:
    desc: Build the desktop app on Linux
    preconditions:
      - sh: 'test "{{OS}}" = "linux"'
        msg: "Linux builds must run on Linux with the target CPU architecture."
    cmds:
      - task: desktop:build

  desktop:windows:
    desc: Build the desktop app on Windows
    preconditions:
      - sh: 'test "{{OS}}" = "windows"'
        msg: "Windows builds must run on Windows with the target CPU architecture."
    cmds:
      - task: desktop:build

  desktop:mac:
    desc: Build the desktop app on macOS
    preconditions:
      - sh: 'test "{{OS}}" = "darwin"'
        msg: "macOS builds must run on macOS with the target CPU architecture."
    cmds:
      - task: desktop:build

  desktop:build:
    internal: true
    cmds:
      - npm ci --prefix desktop
      - npm --prefix desktop run build -- {{.CLI_ARGS}}
