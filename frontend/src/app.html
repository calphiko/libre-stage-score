<!doctype html>
<html lang="de" data-theme="wintry">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        const saved = localStorage.getItem('skeleton-theme');
        const themes = ['catppuccin','cerberus','concord','crimson','dracula','fennec','hamlindigo','legacy','mint','modern','mona','nosh','nouveau','pine','reign','rocket','rose','rosepine','sahara','seafoam','terminus','vintage','vox','wintry'];
        const theme = themes.includes(saved) ? saved : 'wintry';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
